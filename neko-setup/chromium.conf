
[program:chromium]
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s",DISPLAY="%(ENV_DISPLAY)s"
command=bash -c "rm -rf /home/neko/.config/chromium/SingletonLock /home/neko/.config/chromium/Default/SingletonLock /home/neko/.config/chromium/LOCK /home/neko/.config/chromium/Default/Sessions /home/neko/.config/chromium/Default/Session\ Storage || true; sed -i 's/\"exit_type\":\"Crashed\"/\"exit_type\":\"Normal\"/' /home/neko/.config/chromium/Default/Preferences 2>/dev/null || true; sed -i 's/\"exited_cleanly\":false/\"exited_cleanly\":true/' /home/neko/.config/chromium/Default/Preferences 2>/dev/null || true; sed -i 's/\"disable_reasons\":\[[0-9, ]*\]/\"disable_reasons\":[]/g' /home/neko/.config/chromium/Default/Preferences 2>/dev/null || true; sed -i 's/\"developer_mode\":false/\"developer_mode\":true/g' /home/neko/.config/chromium/Default/Preferences 2>/dev/null || true; exec /usr/lib/chromium/chromium --no-sandbox --disable-setuid-sandbox --disable-extensions-except=/src/extension --load-extension=/src/extension --window-position=0,0 --window-size=1280,720 --display=%(ENV_DISPLAY)s --user-data-dir=/home/neko/.config/chromium --profile-directory=Default --disable-profile-picker --no-first-run --start-maximized --disable-gpu --disable-dev-shm-usage --disable-session-crashed-bubble --hide-crash-restore-bubble --disable-features=TranslateUI,ExtensionManifestV2Deprecation,SafetyCheckExtensions --extensions-install-verification=none --extension-content-verification=none --no-default-browser-check --disable-infobars --max-connections-per-server=2 --user-agent='Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/122.0.0.0 Safari/537.36' --remote-debugging-port=9222 --remote-debugging-address=0.0.0.0 --remote-allow-origins=* ${NEKO_PROXY:+--proxy-server=$NEKO_PROXY} %(ENV_NEKO_START_URL)s"
stopsignal=INT
autorestart=true
priority=800
user=%(ENV_USER)s
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:openbox]
environment=HOME="/home/%(ENV_USER)s",USER="%(ENV_USER)s",DISPLAY="%(ENV_DISPLAY)s"
command=/usr/bin/openbox --config-file /etc/neko/openbox.xml
autorestart=true
priority=300
user=%(ENV_USER)s
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
