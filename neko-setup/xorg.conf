# This xorg configuration file is meant to be used by xpra / neko
# to start a dummy X11 server with custom portrait and landscape resolutions.

Section "ServerFlags"
  Option "DontVTSwitch" "true"
  Option "AllowMouseOpenFail" "true"
  Option "PciForceNone" "true"
  Option "AutoEnableDevices" "false"
  Option "AutoAddDevices" "false"
EndSection

Section "InputDevice"
  Identifier "dummy_mouse"
  Option "CorePointer" "true"
  Driver "void"
EndSection

Section "InputDevice"
  Identifier "dummy_keyboard"
  Option "CoreKeyboard" "true"
  Driver "void"
EndSection

Section "InputDevice"
  Identifier "dummy_touchscreen"
  Option "SendCoreEvents" "On"
  Option "SocketName" "/tmp/xf86-input-neko.sock"
  Driver "neko"
EndSection

Section "Device"
  Identifier "dummy_videocard"
  Driver "dummy"
  Option "ConstantDPI" "true"
  VideoRam 1024000
EndSection

Section "Monitor"
  Identifier "dummy_monitor"
  HorizSync   5.0 - 1000.0
  VertRefresh 5.0 - 200.0

  # Custom Portrait Modes (FlirtEasy Mobile Viewports)
  # 768x1024 @ 30.00 Hz (Tablet Portrait Standard)
  Modeline "768x1024_30.00" 31.00 768 792 864 960 1024 1025 1028 1076 -HSync +Vsync
  # 416x912 @ 30.00 Hz (Mobile Smartphone Viewport)
  Modeline "416x912_30.00"  15.20 416 432 472 520 912 913 916 974 -HSync +Vsync
  # 800x1600 @ 30.00 Hz (Tall Mobile Portrait)
  Modeline "800x1600_30.00" 51.58 800 840 928 1056 1600 1601 1604 1628 -HSync +Vsync

  # Standard Landscape Modes
  # 1920x1080 @ 60.00 Hz
  Modeline "1920x1080_60.00" 172.80 1920 2040 2248 2576 1080 1081 1084 1118 -HSync +Vsync
  # 1280x720 @ 60.00 Hz
  Modeline "1280x720_60.00" 74.48 1280 1336 1472 1664 720 721 724 746 -HSync +Vsync
  # 1024x768 @ 60.00 Hz
  Modeline "1024x768_60.00" 65.00 1024 1048 1184 1344 768 771 777 806 -HSync +Vsync
  # 1920x1080 @ 30.00 Hz
  Modeline "1920x1080_30.00" 80.18 1920 1984 2176 2432 1080 1081 1084 1099 -HSync +Vsync
  # 1280x720 @ 30.00 Hz
  Modeline "1280x720_30.00" 33.78 1280 1288 1408 1536 720 721 724 733 -HSync +Vsync
  # 1024x768 @ 30.00 Hz
  Modeline "1024x768_30.00" 30.00 1024 1048 1184 1344 768 771 777 806 -HSync +Vsync
  # 800x600 @ 30.00 Hz
  Modeline "800x600_30.00" 17.01 800 792 864 928 600 601 604 611 -HSync +Vsync
EndSection

Section "Screen"
  Identifier "dummy_screen"
  Device "dummy_videocard"
  Monitor "dummy_monitor"
  DefaultDepth 24
  SubSection "Display"
    Viewport 0 0
    Depth 24
    Modes "768x1024_30.00" "416x912_30.00" "800x1600_30.00" "1024x768_60.00" "1024x768_30.00" "1280x720_60.00" "1280x720_30.00" "1920x1080_60.00" "1920x1080_30.00" "800x600_30.00"
  EndSubSection
EndSection

Section "ServerLayout"
  Identifier   "dummy_layout"
  Screen       "dummy_screen"
  InputDevice  "dummy_mouse"
  InputDevice  "dummy_keyboard"
  InputDevice  "dummy_touchscreen" "CorePointer"
EndSection
